# ── Thème ────────────────────────────────────────────────────

include ./kitty-themes/00-Default.conf

# ── Police & fenêtre ─────────────────────────────────────────

font_family      FantasqueSansM Nerd Font Mono Bold
font_size        11.0
bold_font        auto
italic_font      auto
bold_italic_font auto

window_padding_width 24 80
# Padding en % de la fenêtre (valeur fixe ci-dessus = repli)
watcher padding_watcher.py

background_opacity       0.9
dynamic_background_opacity yes

# ── Tab bar ──────────────────────────────────────────────────

tab_bar_style             powerline
tab_powerline_style       slanted
tab_title_template        "{index}: {title}"
active_tab_foreground     #1a1b26
active_tab_background     #cba6f7
inactive_tab_foreground   #545c7e
inactive_tab_background   #1a1b26
tab_bar_background        #1a1b26

# ── Curseur ──────────────────────────────────────────────────

cursor_shape     block
cursor_blink_interval 0.5

# ── Perf & divers ────────────────────────────────────────────

scrollback_lines         10000
wheel_scroll_min_lines   1
enable_audio_bell        no
confirm_os_window_close  0
linux_display_server     auto

# ── Raccourcis ───────────────────────────────────────────────

# Splits (équivalent WezTerm ALT+c/v)
map alt+c launch --location=hsplit
map alt+v launch --location=vsplit

# Navigation panes (équivalent WezTerm CTRL+flèches)
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# Resize panes (équivalent WezTerm SHIFT+ALT+flèches)
map shift+alt+left  resize_window narrower 5
map shift+alt+right resize_window wider 5
map shift+alt+up    resize_window taller 5
map shift+alt+down  resize_window shorter 5

# Tabs
map super+e new_tab
map super+w close_window confirm=yes
map alt+q   close_window
