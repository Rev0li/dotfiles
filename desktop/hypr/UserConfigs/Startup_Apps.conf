# Commands and Apps to be executed at launch

# Force cursor theme on every login to prevent stuck black cursor (NVIDIA ghost cursor bug)
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Micro Razer jack 3.5mm — source par défaut, volume 30%, non muté
exec-once = sleep 3 && wpctl set-default alsa_input.pci-0000_00_1f.3.analog-stereo && wpctl set-volume alsa_input.pci-0000_00_1f.3.analog-stereo 0.30 && wpctl set-mute alsa_input.pci-0000_00_1f.3.analog-stereo 0


